<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excellent Mirror</title>
<style>
  html,body{margin:0;background:#000;color:#fff;font-family:system-ui,sans-serif;height:100%}
  body{display:flex;flex-direction:column}
  header{padding:12px 16px;background:#111;display:flex;gap:12px;align-items:center}
  #dot{width:10px;height:10px;border-radius:50%;background:#777}
  #status{font-size:14px}
  main{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
  video{max-width:100%;max-height:100%;width:auto;height:auto;background:#000}
  button{background:#222;color:#fff;border:1px solid #555;border-radius:8px;padding:8px 12px}
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <div id="status">Menghubungkan...</div>
  <button id="start">CONNECT</button>
</header>
<main><video id="video" autoplay muted playsinline></video></main>
<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const dot = document.getElementById('dot');
const start = document.getElementById('start');
let source, buffer, media;
let queue = [];
let appending = false;

function status(text, ok=false) {
  statusEl.textContent = text;
  dot.style.background = ok ? '#27d17f' : '#777';
}

function appendNext() {
  if (!buffer || buffer.updating || queue.length === 0) return;
  appending = true;
  try {
    buffer.appendBuffer(queue.shift());
  } catch (e) {
    appending = false;
    if (e.name !== 'QuotaExceededError') console.error(e);
  }
}

function pump(data) {
  queue.push(data);
  if (queue.length > 30) queue.splice(0, queue.length - 30);
  appendNext();
}

function connect() {
  if (!('MediaSource' in window)) {
    status('Browser tidak mendukung MediaSource');
    return;
  }

  status('Menghubungkan ke mirror...');
  media = new MediaSource();
  video.src = URL.createObjectURL(media);

  media.addEventListener('sourceopen', () => {
    // FFmpeg produces H.264 MP4. Let the browser choose the exact profile.
    const candidates = [
      'video/mp4; codecs="avc1.42E01E"',
      'video/mp4; codecs="avc1.4D401F"',
      'video/mp4'
    ];
    const type = candidates.find(t => MediaSource.isTypeSupported(t));
    if (!type) {
      status('Browser tidak mendukung H.264 MP4');
      return;
    }

    try {
      source = media.addSourceBuffer(type);
      source.mode = 'segments';
      source.addEventListener('updateend', () => {
        appending = false;
        // Keep latency bounded by trimming old buffered data.
        if (video.currentTime > 0 && source.buffered.length) {
          const end = source.buffered.end(source.buffered.length - 1);
          if (end - video.currentTime > 2.5) {
            try { source.remove(0, Math.max(0, end - 1.5)); } catch {}
          }
        }
        appendNext();
      });
    } catch (e) {
      status('Gagal membuat decoder: ' + e.message);
      return;
    }

    fetch('/stream', {cache:'no-store'}).then(async r => {
      if (!r.ok || !r.body) throw new Error('stream HTTP ' + r.status);
      status('MIRROR AKTIF', true);
      const reader = r.body.getReader();

      while (true) {
        const {value, done} = await reader.read();
        if (done) break;
        if (value) pump(value);
      }
      status('Stream terputus');
    }).catch(e => {
      console.error(e);
      status('Tidak bisa menerima stream');
    });
  }, {once:true});

  video.play().catch(()=>{});
}

start.onclick = connect;
connect();
</script>
</body>
</html>
