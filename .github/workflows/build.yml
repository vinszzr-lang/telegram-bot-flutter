name: Auto Build APK (Auto Unzip & Build)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract File Zip (Auto Detect)
        run: |
          echo "Mencari file .zip..."
          # Cari file .zip yang ada di repo (termasuk folder upload/)
          ZIP_FILE=$(find . -name "*.zip" -not -path "*/.*" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Menemukan file zip: $ZIP_FILE"
            echo "Mengekstrak..."
            unzip -o "$ZIP_FILE" -d ./extracted_project
          else
            echo "Tidak ada file .zip, melanjutkan dengan folder biasa..."
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Detect Folder Project Flutter
        id: detect
        run: |
          # Cari file pubspec.yaml setelah diekstrak
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::File pubspec.yaml tidak ditemukan di dalam zip atau repository!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Project Flutter ditemukan di: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: ${{ steps.detect.outputs.dir }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simtudduror-Release-APK
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          
