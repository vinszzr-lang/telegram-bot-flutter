name: Auto Build APK (Auto Detect)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cari & Detect Folder Project Flutter
        id: detect
        run: |
          # Cari lokasi file pubspec.yaml otomatis
          PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "::error::File pubspec.yaml tidak ditemukan di repository ini!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Project ditemukan di folder: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: ${{ steps.detect.outputs.dir }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simtudduror-Release-APK
          path: '**/build/app/outputs/flutter-apk/app-release.apk'
          
