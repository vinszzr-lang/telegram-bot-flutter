name: Build ChatWithU Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          flutter --version
          dart --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Verify Gradle wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Build APK - Split ABI
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=CHATWITHU_BASE_URL=http://panelbaru2.rexzystr.my.id:5201

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            dist/ChatWithU-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            dist/ChatWithU-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            dist/ChatWithU-x86_64.apk

          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChatWithU-Android-Split-ABI
          path: dist/
