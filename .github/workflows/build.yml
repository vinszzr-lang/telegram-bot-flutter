name: Build ChatWithU Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Only install/configure the Android command-line tools here.
      # The actual SDK packages are installed manually below so a package
      # lookup failure inside setup-android cannot abort this step.
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          # 20.0 is used instead of the newly released 22.0 because the
          # current 22.0 path has active sdkmanager/package-resolution issues.
          cmdline-tools-version: '14742923'
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Android SDK root: ${ANDROID_SDK_ROOT:-${ANDROID_HOME:-not-set}}"
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK - Split ABI
        run: flutter build apk --release --split-per-abi --dart-define=CHATWITHU_BASE_URL=https://stock-staining-composure.ngrok-free.dev

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ChatWithU-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ChatWithU-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/ChatWithU-x86_64.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ChatWithU-Android-Split-ABI
          path: dist/
