<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Excellent Mirror</title>
  <style>
    html,body{margin:0;background:#050505;color:#fff;font-family:system-ui,sans-serif;height:100%}
    body{display:flex;flex-direction:column}
    header{padding:10px 14px;display:flex;gap:12px;align-items:center;background:#111}
    #status{font-size:14px;opacity:.8}
    main{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
    canvas{max-width:100%;max-height:100%;width:auto;height:auto;background:#000}
  </style>
</head>
<body>
  <header>
    <strong>Excellent Mirror</strong>
    <span id="status">Menghubungkan…</span>
  </header>
  <main><canvas id="video"></canvas></main>

  <!-- JSMpeg decodes the low-latency MPEG-TS WebSocket stream. -->
  <script src="https://cdn.jsdelivr.net/npm/jsmpeg@0.2.1/jsmpeg.min.js"></script>
  <script>
    const status = document.getElementById("status");
    const canvas = document.getElementById("video");
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const url = `${protocol}//${location.host}/stream`;

    let player;
    function connect() {
      status.textContent = "Menghubungkan…";
      try {
        player = new JSMpeg.Player(url, {
          canvas,
          autoplay: true,
          audio: false,
          disableGl: false,
          videoBufferSize: 512 * 1024,
          onSourceEstablished: () => status.textContent = "LIVE",
          onSourceCompleted: () => status.textContent = "Sumber berhenti"
        });
      } catch (e) {
        status.textContent = "Gagal memulai player";
        setTimeout(connect, 1500);
      }
    }
    connect();
  </script>
</body>
</html>
