<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excellent Mirror</title>
<style>
  html,body{margin:0;background:#0b0b0b;color:#eee;font-family:system-ui,sans-serif;height:100%}
  body{display:flex;flex-direction:column}
  header{padding:12px 16px;display:flex;gap:12px;align-items:center;background:#151515}
  #status{font-size:14px;color:#aaa}
  canvas{display:block;margin:auto;max-width:100vw;max-height:calc(100vh - 56px);width:auto;height:auto;background:#000}
</style>
</head>
<body>
<header><b>Excellent Mirror</b><span id="status">connecting...</span></header>
<canvas id="screen"></canvas>
<script>
const statusEl = document.getElementById('status');
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', {alpha:false, desynchronized:true});
let ws, decoder, configReady = false;
let reconnectTimer = null;

function setStatus(s){ statusEl.textContent = s; }

function packetView(data) {
  const a = new Uint8Array(data);
  if (a.byteLength < 13) return null;
  const dv = new DataView(data);
  const declared = dv.getUint32(0);
  if (declared !== a.byteLength) return null;
  const type = a[4];
  const hi = dv.getUint32(5);
  const lo = dv.getUint32(9);
  const timestampUs = hi * 4294967296 + lo;
  return {type, timestampUs, payload:a.slice(13)};
}

function makeDecoder() {
  decoder = new VideoDecoder({
    output(frame) {
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth;
        canvas.height = frame.displayHeight;
      }
      ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
      frame.close();
    },
    error(err) {
      console.error(err);
      configReady = false;
      setStatus('decoder error — waiting for keyframe');
    }
  });
}

function connect() {
  clearTimeout(reconnectTimer);
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws?role=viewer`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => setStatus('viewer connected — waiting for stream');
  ws.onclose = () => {
    setStatus('server disconnected — reconnecting...');
    reconnectTimer = setTimeout(connect, 1500);
  };
  ws.onerror = () => setStatus('connection error');

  ws.onmessage = async (ev) => {
    if (!('VideoDecoder' in window)) {
      setStatus('This browser has no WebCodecs VideoDecoder');
      return;
    }
    const p = packetView(ev.data);
    if (!p) return;

    if (p.type === 0) {
      try {
        if (decoder) decoder.close();
        makeDecoder();

        // AVCDecoderConfigurationRecord: bytes 1..3 carry
        // profile/compatibility/level, so build the avc1 codec string.
        if (p.payload.length < 4) return;
        const h = p.payload;
        const hex = n => n.toString(16).padStart(2,'0');
        const codec = `avc1.${hex(h[1])}${hex(h[2])}${hex(h[3])}`;

        decoder.configure({
          codec,
          description: p.payload.buffer.slice(
            p.payload.byteOffset, p.payload.byteOffset + p.payload.byteLength
          ),
          optimizeForLatency: true,
          hardwareAcceleration: 'prefer-hardware'
        });
        configReady = true;
        setStatus('decoder ready — streaming');
      } catch (e) {
        console.error(e);
        configReady = false;
        setStatus('decoder config failed');
      }
      return;
    }

    if (!configReady || !decoder) return;

    // Keep the queue tiny. If the browser falls behind, discard queued
    // delta frames and wait for the next keyframe.
    if (decoder.decodeQueueSize > 3 && p.type !== 1) return;

    try {
      decoder.decode(new EncodedVideoChunk({
        type: p.type === 1 ? 'key' : 'delta',
        timestamp: p.timestampUs,
        data: p.payload
      }));
    } catch (e) {
      console.warn(e);
    }
  };
}

if (!('VideoDecoder' in window)) {
  setStatus('WebCodecs is required');
} else {
  makeDecoder();
  connect();
}
</script>
</body>
</html>
