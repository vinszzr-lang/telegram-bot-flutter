<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Chat • Command Center</title>
<style>
:root{--bg:#060810;--panel:#0c1120;--panel2:#10182a;--line:#202a40;--text:#f4f7ff;--muted:#8e9ab3;--accent:#7c5cff;--accent2:#2de2b1;--red:#ff5571;--yellow:#ffd166;--blue:#55a8ff;--shadow:0 30px 90px #0009;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 600px at 10% -5%,#30226b55,transparent 60%),radial-gradient(800px 500px at 100% 0%,#0b7d7050,transparent 60%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,#000,transparent 80%)}
button,input,textarea,select{font:inherit}.hidden{display:none!important}.muted{color:var(--muted)}.danger{color:#ff8a9b}.ok{color:#65e9bb}
.fade-in{animation:fadeIn .35s ease both}.pop{animation:pop .35s cubic-bezier(.2,.9,.2,1) both}.slide{animation:slide .35s ease both}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}@keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #7c5cff00}50%{box-shadow:0 0 0 8px #7c5cff18}}@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;position:relative}.login-card{width:min(470px,100%);padding:38px;border:1px solid #ffffff12;border-radius:32px;background:linear-gradient(145deg,#11182af2,#080d17ee);box-shadow:var(--shadow);backdrop-filter:blur(24px);position:relative;overflow:hidden}.login-card:before{content:"";position:absolute;inset:-100px;background:conic-gradient(from 90deg,#7c5cff00,#7c5cff33,#2de2b100,#7c5cff00);animation:spin 9s linear infinite;filter:blur(35px)}@keyframes spin{to{transform:rotate(360deg)}}.login-inner{position:relative}.brand{font-weight:950;font-size:30px;letter-spacing:-1.5px}.brand b{color:var(--accent)}.brand-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent2);margin-left:8px;box-shadow:0 0 18px var(--accent2);animation:pulse 2s infinite}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9ea9c3;margin-top:9px}.field{margin-top:16px}.label{display:block;color:#aab5ca;font-size:12px;font-weight:800;margin:0 0 7px 3px}.input,.select,.textarea{width:100%;background:#070c16cc;border:1px solid #ffffff10;color:var(--text);border-radius:15px;padding:13px 14px;outline:none;transition:.2s}.input:focus,.select:focus,.textarea:focus{border-color:#7c5cff99;box-shadow:0 0 0 4px #7c5cff15;transform:translateY(-1px)}
.btn{border:1px solid transparent;border-radius:14px;padding:11px 15px;background:linear-gradient(135deg,#7c5cff,#5b45dd);color:white;font-weight:850;cursor:pointer;transition:transform .18s,filter .18s,box-shadow .18s;box-shadow:0 8px 24px #7c5cff20}.btn:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 12px 30px #7c5cff2b}.btn:active{transform:translateY(0) scale(.98)}.btn.ghost{background:#ffffff08;border-color:#ffffff10;color:#d8e0ef;box-shadow:none}.btn.red{background:linear-gradient(135deg,#d93f5d,#a8213e)}.btn.green{background:linear-gradient(135deg,#1dbb85,#12835e)}.btn.yellow{background:linear-gradient(135deg,#c89422,#8d6510)}.btn.blue{background:linear-gradient(135deg,#4b9cff,#2866bd)}
.shell{min-height:100vh;display:flex}.side{width:270px;flex:0 0 270px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid #ffffff0c;background:#080d16d9;backdrop-filter:blur(20px);display:flex;flex-direction:column;z-index:5}.side-top{display:flex;align-items:center;gap:10px;padding:8px 10px}.mini-logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#2de2b1);display:grid;place-items:center;font-weight:950;box-shadow:0 12px 30px #7c5cff2a}.side-title{font-weight:900;font-size:16px}.nav{display:grid;gap:7px;margin-top:30px}.nav button{border:1px solid transparent;background:transparent;color:#8996ad;text-align:left;padding:12px 13px;border-radius:14px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:11px}.nav button:hover{background:#ffffff07;color:#fff;transform:translateX(3px)}.nav button.active{background:linear-gradient(90deg,#7c5cff22,#2de2b108);border-color:#7c5cff24;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}.side-bottom{margin-top:auto}.admin-chip{padding:12px;border:1px solid #ffffff0b;border-radius:16px;background:#ffffff05;margin-bottom:10px}.main{flex:1;min-width:0;padding:28px;max-width:1700px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.title{font-size:28px;font-weight:950;letter-spacing:-1px}.sub{color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(145deg,#0f1726d9,#0a101bd9);border:1px solid #ffffff0d;border-radius:var(--radius);padding:18px;box-shadow:0 16px 45px #0004;backdrop-filter:blur(15px);transition:.2s}.card:hover{border-color:#ffffff18;transform:translateY(-2px)}.stat{position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:110px;height:110px;right:-35px;top:-35px;background:radial-gradient(circle,#7c5cff28,transparent 70%)}.stat .label{color:#8f9bb3;font-size:11px;text-transform:uppercase;letter-spacing:.1em}.stat .num{font-size:31px;font-weight:950;margin-top:7px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .input{max-width:420px}.table-wrap{overflow:auto;border:1px solid #ffffff0b;border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:13px 14px;border-bottom:1px solid #ffffff08;text-align:left}.table th{color:#748199;font-size:10px;text-transform:uppercase;letter-spacing:.1em;background:#090f19}.table tr{transition:.15s}.table tbody tr:hover{background:#ffffff04}.usercell{display:flex;align-items:center;gap:11px}.avatar{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#7c5cff,#2de2b1);display:grid;place-items:center;font-weight:950;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-size:10px;font-weight:900;margin:2px;background:#172235;color:#b9c6da;border:1px solid #ffffff08}.pill.green{background:#0a3b2c;color:#66e6b4}.pill.red{background:#431723;color:#ff8498}.pill.blue{background:#102e4b;color:#74bbff}.pill.yellow{background:#423415;color:#f7d86e}.actions{display:flex;gap:6px;flex-wrap:wrap}.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini{background:#ffffff05;border:1px solid #ffffff08;border-radius:15px;padding:13px}.mini b{display:block;font-size:18px;margin-top:4px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50;backdrop-filter:blur(10px);animation:fadeIn .2s}.modal-card{width:min(860px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#111a2b,#080e18);border:1px solid #ffffff14;border-radius:26px;padding:22px;box-shadow:var(--shadow);animation:pop .3s cubic-bezier(.2,.9,.2,1)}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#ffffff05;border:1px solid #ffffff09;border-radius:16px;padding:14px}.switch input{width:22px;height:22px;accent-color:var(--accent)}.badge-editor{display:flex;flex-wrap:wrap;gap:7px}.badge-chip{border:1px solid #ffffff10;background:#141e30;color:#b9c7db;border-radius:999px;padding:7px 10px;cursor:pointer}.badge-chip.on{background:#7c5cff22;border-color:#7c5cff66;color:#dcd7ff}.activity{display:grid;gap:9px}.activity-item{background:#ffffff04;border:1px solid #ffffff08;border-radius:15px;padding:13px;transition:.18s}.activity-item:hover{transform:translateX(3px);border-color:#ffffff15}.toast{position:fixed;right:22px;bottom:22px;background:#111b2b;border:1px solid #ffffff15;padding:13px 16px;border-radius:15px;z-index:80;box-shadow:0 20px 60px #0008;animation:pop .25s}.loading{display:grid;place-items:center;min-height:180px}.spinner{width:30px;height:30px;border:3px solid #ffffff12;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}.progress{height:3px;background:linear-gradient(90deg,#7c5cff,#2de2b1,#7c5cff);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:9px}.empty{text-align:center;padding:50px 20px;color:var(--muted)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.side{width:230px;flex-basis:230px}.mini-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.shell{display:block}.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid #ffffff0c}.nav{display:flex;overflow:auto;margin-top:16px}.nav button{white-space:nowrap}.side-bottom{margin-top:15px}.main{padding:15px}.grid{grid-template-columns:1fr 1fr}.formgrid,.mini-grid{grid-template-columns:1fr}.top{flex-direction:column}.title{font-size:24px}.modal{padding:8px}.modal-card{padding:16px;border-radius:20px}}
</style>

<style>
/* Small additive admin enhancements; existing visual language remains unchanged. */
.health-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#65e9bb;box-shadow:0 0 14px #65e9bb66;margin-right:6px}
.health-dot.bad{background:#ff5571;box-shadow:0 0 14px #ff557166}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kpi{background:#ffffff04;border:1px solid #ffffff08;border-radius:15px;padding:12px}
.kpi b{display:block;font-size:16px;margin-top:4px}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.codebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#050913;border:1px solid #ffffff0b;border-radius:13px;padding:10px;overflow:auto;color:#b9c7da}
@media(max-width:900px){.kpi-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="login-inner">
  <div class="brand">ChatWith<span style="color:var(--accent)">U</span><span class="brand-dot"></span></div>
  <div class="eyebrow">Command Center • Secure Admin</div>
  <p class="sub">Kelola user, verified, banned, badge, pesan, settings, dan password admin dalam satu panel.</p>
  <div class="field"><label class="label">Admin username</label><input id="au" class="input" autocomplete="username" placeholder="admin"></div>
  <div class="field"><label class="label">Password</label><input id="ap" class="input" type="password" autocomplete="current-password" placeholder="••••••••"></div>
  <div class="field"><button class="btn" style="width:100%;padding:14px" onclick="login()">Masuk ke Command Center →</button></div>
  <div id="loginErr" class="danger" style="margin-top:12px"></div>
</div></div></div>

<div id="app" class="shell hidden">
<aside class="side">
  <div class="side-top"><div class="mini-logo">CU</div><div><div class="side-title">X Chat</div><div class="muted" style="font-size:11px">Command Center</div></div></div>
  <div class="nav">
    <button data-page="overview" class="active" onclick="page('overview',this)">◈ <span>Overview</span></button>
    <button data-page="users" onclick="page('users',this)">◎ <span>Users</span></button>
    <button data-page="messages" onclick="page('messages',this)">▣ <span>Messages</span></button>
    <button data-page="activity" onclick="page('activity',this)">◷ <span>Activity</span></button>
    <button data-page="settings" onclick="page('settings',this)">⚙ <span>Settings</span></button>
    <button data-page="admins" id="adminsNav" class="hidden" onclick="page('admins',this)">♛ <span>Admin Accounts</span></button>
  </div>
  <div class="side-bottom"><div class="admin-chip"><div class="muted" style="font-size:10px;text-transform:uppercase;letter-spacing:.1em">Signed in as</div><b id="adminName">admin</b></div><button class="btn red" style="width:100%" onclick="logout()">Keluar</button></div>
</aside>
<main class="main"><div id="content"></div></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div id="modalContent"></div></div></div><div id="toast" class="toast hidden"></div>
<script>
let token=localStorage.getItem('cwu_admin_v4')||'';let currentPage='overview';let usersCache=[];let userBadges=[];let myRole='admin';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function anim(){const c=$('content');c.classList.remove('fade-in');void c.offsetWidth;c.classList.add('fade-in')}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),10000);opt.signal=ctrl.signal;
const r=await fetch(path,opt);clearTimeout(timeout);let d={};try{d=await r.json()}catch{}if(r.status===401){logout()}if(!r.ok)throw new Error(d.message||'Request gagal');return d}
function toast(s,good=true){$('toast').textContent=s;$('toast').classList.remove('hidden');$('toast').style.borderColor=good?'#2de2b155':'#ff557155';setTimeout(()=>$('toast').classList.add('hidden'),2300)}
async function login(){try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('au').value.trim(),password:$('ap').value})});const d=await r.json();if(!r.ok)throw new Error(d.message);token=d.token;localStorage.setItem('cwu_admin_v4',token);await boot()}catch(e){$('loginErr').textContent=e.message}}
function logout(){localStorage.removeItem('cwu_admin_v4');token='';location.reload()}
async function boot(){if(!token)return;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{const me=await api('/api/admin/me');myRole=me.role||'admin';$('adminName').textContent=me.username+' · '+myRole;document.querySelector('#adminsNav').classList.toggle('hidden',myRole!=='developer');page('overview',document.querySelector('[data-page="overview"]'))}catch{logout()}}
function page(p,el){currentPage=p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');({overview:renderOverview,users:renderUsers,messages:renderMessages,activity:renderActivity,settings:renderSettings,admins:renderAdmins}[p]||renderOverview)();anim()}
let liveBusy=false;
let liveCache={overview:null,users:null,messages:null,activity:null};
function stableUsers(items){return JSON.stringify((items||[]).map(u=>({username:u.username,firstName:u.firstName,lastName:u.lastName,bio:u.bio,verified:u.verified,banned:u.banned,badges:u.badges||[],createdAt:u.createdAt,stats:u.stats})));}
function updateUserLive(items){(items||[]).forEach(u=>{const row=document.querySelector(`[data-user-row="${CSS.escape(u.username)}"]`);if(!row)return;const st=row.querySelector('[data-user-status]');if(st)st.innerHTML=u.online?'<span class="pill green">● Online</span>':'<span class="pill">○ Offline</span>';const ls=row.querySelector('[data-user-lastseen]');if(ls)ls.textContent=fmt(u.lastSeenAt);const bd=row.querySelector('[data-user-badges]');if(bd)bd.innerHTML=userBadgesHtml(u);});}
async function liveTick(){if(!token||liveBusy||document.hidden)return;liveBusy=true;try{if(currentPage==='overview'){const d=await api('/api/admin/overview');const sig=JSON.stringify({users:d.users,online:d.online,verified:d.verified,banned:d.banned,messages:d.messages,media:d.media,contacts:d.contacts,registrations24h:d.registrations24h,settings:d.settings});if(liveCache.overview===null){liveCache.overview=sig;await renderOverview()}else{liveCache.overview=sig;['Users','Online','Verified','Banned','Messages','Media','Contacts','24h'].forEach((k,i)=>{const keys=['users','online','verified','banned','messages','media','contacts','registrations24h'];const el=document.querySelector(`[data-stat="${k}"]`);if(el)el.textContent=d[keys[i]]});const mini=document.querySelectorAll('.mini b');if(mini.length>=6){mini[0].textContent=Math.floor(d.uptime/3600)+'h '+Math.floor(d.uptime/60)%60+'m';mini[1].textContent=Math.round(d.memory/1024/1024)+' MB';mini[2].textContent=d.settings.registrationEnabled?'ON':'OFF';mini[3].textContent=d.settings.maintenance?'ON':'OFF';mini[4].textContent=d.settings.maxUploadMb+' MB';mini[5].textContent=d.settings.announcement||'—';}}}else if(currentPage==='users'){const q=encodeURIComponent($('uq')?.value||'');const status=encodeURIComponent($('us')?.value||'all');const d=await api(`/api/admin/users?limit=200&q=${q}&status=${status}`);const sig=stableUsers(d.items);if(liveCache.users===null){liveCache.users=sig;await renderUsers()}else{if(sig!==liveCache.users){liveCache.users=sig;await renderUsers()}else updateUserLive(d.items);}}else if(currentPage==='messages'){const d=await api('/api/admin/messages?limit=200');const sig=JSON.stringify(d.items||[]);if(liveCache.messages===null){liveCache.messages=sig;await renderMessages()}else if(sig!==liveCache.messages){liveCache.messages=sig;await renderMessages();}}else if(currentPage==='activity'){const d=await api('/api/admin/activity?limit=150');const sig=JSON.stringify(d.items||[]);if(liveCache.activity===null){liveCache.activity=sig;await renderActivity()}else if(sig!==liveCache.activity){liveCache.activity=sig;await renderActivity();}}}catch(e){}finally{liveBusy=false}}
setInterval(liveTick,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)liveTick()});
function stat(a,b,c,icon){return `<div class="card stat pop" data-stat-card="${a}"><div class="label">${icon||''} ${a}</div><div class="num" data-stat="${a}">${b}</div><div class="muted">${c}</div></div>`}
async function renderOverview(){
  const [d,h]=await Promise.all([api('/api/admin/overview'),api('/api/admin/health')]);
  const mb=n=>Math.round(Number(n||0)/1024/1024);
  const gb=n=>(Number(n||0)/1024/1024/1024).toFixed(2);
  $('content').innerHTML=`<div class="top"><div><div class="title">Good evening, Admin 👋</div><div class="sub">Command center X Chat • semua kontrol server dari sini.</div></div><div class="quick-actions"><button class="btn ghost" onclick="renderOverview()">↻ Refresh</button><button class="btn blue" onclick="quickBackup()">▣ Backup DB</button><button class="btn ghost" onclick="exportUsers()">⇩ Export Users</button></div></div>
  <div class="grid">${stat('Users',d.users,'Total akun','◎')}${stat('Online',d.online,'Socket aktif','●')}${stat('Verified',d.verified,'User verified','✓')}${stat('Banned',d.banned,'Akun diblokir','!')}${stat('Messages',d.messages,'Total pesan','▣')}${stat('Media',d.media,'Foto/video/file','◫')}${stat('Contacts',d.contacts,'Relasi kontak','◌')}${stat('24h',d.registrations24h,'Registrasi baru','↗')}</div>
  <br><div class="card slide"><div class="top" style="margin-bottom:14px"><div><h3 style="margin:0">Server pulse</h3><div class="sub">Runtime, storage, socket, dan konfigurasi.</div></div><span class="pill green"><span class="health-dot"></span>ONLINE</span></div>
  <div class="mini-grid"><div class="mini">Uptime<b>${Math.floor(d.uptime/3600)}h ${Math.floor(d.uptime/60)%60}m</b></div><div class="mini">Memory<b>${mb(d.memory)} MB</b></div><div class="mini">DB size<b>${Math.round(h.dbBytes/1024)} KB</b></div><div class="mini">Uploads<b>${gb(h.uploadBytes)} GB</b></div><div class="mini">Node<b>${esc(h.node)}</b></div><div class="mini">Socket clients<b>${h.sockets}</b></div></div>
  <div class="kpi-row"><div class="kpi">Registration<b>${d.settings.registrationEnabled?'ON':'OFF'}</b></div><div class="kpi">Maintenance<b>${d.settings.maintenance?'ON':'OFF'}</b></div><div class="kpi">Upload limit<b>${d.settings.maxUploadMb} MB</b></div><div class="kpi">Announcement<b>${esc(d.settings.announcement||'—')}</b></div></div></div>
  <br><div class="card"><div class="top" style="margin-bottom:10px"><div><h3 style="margin:0">Quick controls</h3><div class="sub">Akses cepat untuk tindakan yang paling sering dipakai.</div></div></div>
  <div class="quick-actions"><button class="btn ghost" onclick="page('users',document.querySelector('[data-page=users]'))">Kelola Users →</button><button class="btn ghost" onclick="page('messages',document.querySelector('[data-page=messages]'))">Moderasi Messages →</button><button class="btn ghost" onclick="page('settings',document.querySelector('[data-page=settings]'))">Server Settings →</button></div></div>`;
}
async function quickBackup(){
  try{
    const d=await api('/api/admin/backup',{method:'POST'});
    toast('Backup database dibuat ✓');
    if(d.download) window.open(d.download,'_blank');
  }catch(e){toast(e.message,false)}
}
function downloadBlob(name,text,type='application/json'){
  const blob=new Blob([text],{type}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function exportUsers(){
  try{
    const d=await api('/api/admin/users?limit=200');
    const safe=(d.items||[]).map(u=>({username:u.username,name:u.name,bio:u.bio,verified:u.verified,banned:u.banned,badges:u.badges||[],createdAt:u.createdAt,lastSeenAt:u.lastSeenAt,stats:u.stats,online:u.online}));
    downloadBlob('chatwithu-users.json',JSON.stringify(safe,null,2));
    toast('Export users selesai ✓');
  }catch(e){toast(e.message,false)}
}
async function loadUsers(){const q=encodeURIComponent($('uq')?.value||'');const status=encodeURIComponent($('us')?.value||'all');const d=await api(`/api/admin/users?limit=200&q=${q}&status=${status}`);usersCache=d.items||[]}
function userBadgesHtml(u){return `${u.verified?'<span class="pill green">✓ Verified</span>':''}${u.banned?'<span class="pill red">⛔ Banned</span>':''}${(u.badges||[]).map(b=>`<span class="pill blue">${esc(b)}</span>`).join('')}`||'<span class="muted">—</span>'}
async function renderUsers(){await loadUsers();$('content').innerHTML=`<div class="top"><div><div class="title">Users</div><div class="sub">Data user lengkap yang aman untuk admin • password/hash tidak pernah ditampilkan.</div></div><button class="btn ghost" onclick="renderUsers()">↻ Refresh</button></div><div class="card"><div class="toolbar"><input id="uq" class="input" placeholder="Cari username, nama, bio..." value="${esc(new URLSearchParams(location.search).get('q')||'')}" onkeydown="if(event.key==='Enter')renderUsers()"><select id="us" class="select" onchange="renderUsers()"><option value="all">Semua</option><option value="online">Online</option><option value="offline">Offline</option><option value="verified">Verified</option><option value="banned">Banned</option></select><button class="btn" onclick="renderUsers()">Cari</button></div><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Status</th><th>Badge</th><th>Created</th><th>Last seen</th><th>Stats</th><th>Aksi</th></tr></thead><tbody>${usersCache.map((u,i)=>`<tr class="slide" data-user-row="${esc(u.username)}" style="animation-delay:${Math.min(i,10)*20}ms"><td><div class="usercell"><div class="avatar">${u.avatarUrl?`<img src="${esc(u.avatarUrl)}">`:esc((u.firstName||u.username).slice(0,1).toUpperCase())}</div><div><b>@${esc(u.username)}</b><div class="muted">${esc(u.name||u.username)}</div></div></div></td><td data-user-status>${u.online?'<span class="pill green">● Online</span>':'<span class="pill">○ Offline</span>'}</td><td data-user-badges>${userBadgesHtml(u)}</td><td>${fmt(u.createdAt)}</td><td data-user-lastseen>${fmt(u.lastSeenAt)}</td><td>${u.stats.totalMessages} msg · ${u.stats.media} media · ${u.stats.contacts} contacts</td><td><button class="btn ghost" onclick="openUser('${encodeURIComponent(u.username)}')">Detail →</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Tidak ada user.</td></tr>`}</tbody></table></div></div>`}
async function openUser(enc){const u=await api('/api/admin/users/'+enc);userBadges=[...(u.badges||[])];const presets=['verified','official','moderator','developer','staff','vip','creator'];$('modalContent').innerHTML=`<div class="modal-head"><div><h2 style="margin:0">@${esc(u.username)}</h2><div class="muted">Full profile control</div></div><button class="btn ghost" onclick="closeModal()">✕</button></div><div class="mini-grid" style="margin-bottom:14px"><div class="mini">Messages<b>${u.stats.totalMessages}</b></div><div class="mini">Media<b>${u.stats.media}</b></div><div class="mini">Contacts<b>${u.stats.contacts}</b></div><div class="mini">Sent<b>${u.stats.sent}</b></div><div class="mini">Received<b>${u.stats.received}</b></div><div class="mini">Online<b>${u.online?'YES':'NO'}</b></div></div><div class="formgrid"><div><label class="label">First name</label><input id="uf" class="input" value="${esc(u.firstName)}"></div><div><label class="label">Last name</label><input id="ul" class="input" value="${esc(u.lastName)}"></div><div class="full"><label class="label">Bio</label><textarea id="ub" class="textarea" rows="3">${esc(u.bio)}</textarea></div><div class="switch"><div><b>Verified</b><div class="muted">Tampilkan badge verified di client.</div></div><input id="uv" type="checkbox" ${u.verified?'checked':''}></div><div class="switch"><div><b>Banned</b><div class="muted">User tidak dapat login/socket.</div></div><input id="ux" type="checkbox" ${u.banned?'checked':''}></div><div class="full"><label class="label">Badges</label><div id="badges" class="badge-editor">${presets.map(b=>`<button class="badge-chip ${userBadges.includes(b)?'on':''}" onclick="toggleBadge('${b}',this)">${b}</button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:10px"><input id="customBadge" class="input" placeholder="custom badge"><button class="btn ghost" onclick="addCustomBadge()">+ Add</button></div><div id="customList" style="margin-top:8px">${renderCustomBadges(presets)}</div></div><div class="full"><label class="label">Reset password user (opsional)</label><input id="up" class="input" type="password" placeholder="Kosongkan jika tidak diubah"></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button class="btn red" onclick="deleteUser('${encodeURIComponent(u.username)}')">Hapus user</button><button class="btn" onclick="saveUser('${encodeURIComponent(u.username)}')">Simpan perubahan</button></div>`;$('modal').classList.remove('hidden')}
function renderCustomBadges(presets){return userBadges.filter(b=>!presets.includes(b)).map(b=>`<button class="badge-chip on" onclick="removeBadge('${esc(b)}')">${esc(b)} ×</button>`).join('')}
function toggleBadge(b,el){userBadges=userBadges.includes(b)?userBadges.filter(x=>x!==b):[...userBadges,b];el.classList.toggle('on',userBadges.includes(b))}
function addCustomBadge(){const v=$('customBadge').value.trim();if(v&&!userBadges.includes(v))userBadges.push(v);$('customBadge').value='';const presets=['verified','official','moderator','developer','staff','vip','creator'];$('customList').innerHTML=renderCustomBadges(presets)}
function removeBadge(b){userBadges=userBadges.filter(x=>x!==b);const presets=['verified','official','moderator','developer','staff','vip','creator'];$('customList').innerHTML=renderCustomBadges(presets);document.querySelectorAll('.badge-chip').forEach(x=>{if(x.textContent.trim()===b)x.remove()})}
async function saveUser(enc){const body={firstName:$('uf').value,lastName:$('ul').value,bio:$('ub').value,verified:$('uv').checked,banned:$('ux').checked,badges:userBadges};if($('up').value)body.password=$('up').value;await api('/api/admin/users/'+enc,{method:'PATCH',body:JSON.stringify(body)});toast('User berhasil diperbarui');closeModal();renderUsers()}
async function deleteUser(enc){if(!confirm('Hapus user beserta kontak dan pesan terkait?'))return;await api('/api/admin/users/'+enc,{method:'DELETE'});toast('User dihapus');closeModal();renderUsers()}
async function renderMessages(){const d=await api('/api/admin/messages?limit=200');$('content').innerHTML=`<div class="top"><div><div class="title">Messages</div><div class="sub">Moderasi percakapan dan attachment.</div></div><div class="quick-actions"><button class="btn ghost" onclick="renderMessages()">↻ Refresh</button><button class="btn blue" onclick="exportMessages()">⇩ Export</button></div></div><div class="card"><div class="toolbar"><input id="mq" class="input" placeholder="Cari username, pesan, file..." oninput="filterMsgs(${JSON.stringify(d.items).replace(/</g,'\\u003c')})"></div><div id="mlist" class="activity"></div></div>`;filterMsgs(d.items)}
function filterMsgs(items){const q=($('mq')?.value||'').toLowerCase();const arr=items.filter(m=>!q||JSON.stringify(m).toLowerCase().includes(q));$('mlist').innerHTML=arr.map(m=>{const body=m.type==='text'?esc(m.message):'<span class="pill blue">'+esc(m.type)+'</span> '+esc(m.fileName||'');return `<div class="activity-item"><div><b>@${esc(m.senderUsername)}</b> → <b>@${esc(m.recipientUsername)}</b> <span class="muted">${fmt(m.createdAt)}</span></div><div style="margin-top:7px">${body}</div><div style="margin-top:9px"><button class="btn red" onclick="deleteMsg('${esc(m.id)}')">Hapus pesan</button></div></div>`}).join('')||'<div class="empty">Tidak ada pesan.</div>'}
async function exportMessages(){
  try{
    const d=await api('/api/admin/messages?limit=200');
    downloadBlob('chatwithu-messages.json',JSON.stringify(d.items||[],null,2));
    toast('Export messages selesai ✓');
  }catch(e){toast(e.message,false)}
}
async function deleteMsg(id){if(!confirm('Hapus pesan ini?'))return;await api('/api/admin/messages/'+encodeURIComponent(id),{method:'DELETE'});toast('Pesan dihapus');renderMessages()}
async function renderActivity(){const d=await api('/api/admin/activity?limit=150');$('content').innerHTML=`<div class="top"><div><div class="title">Activity</div><div class="sub">Audit log semua perubahan penting.</div></div><button class="btn ghost" onclick="renderActivity()">↻ Refresh</button></div><div class="activity">${d.items.map(x=>`<div class="activity-item"><b>${esc(x.type)}</b><div class="muted">actor: ${esc(x.actor)} · target: ${esc(x.target)} · ${fmt(x.createdAt)}</div><div style="margin-top:6px">${esc(JSON.stringify(x.meta||{}))}</div></div>`).join('')||'<div class="card empty">Belum ada aktivitas.</div>'}</div>`}
async function renderAdmins(){
  if(myRole!=='developer'){toast('Hanya developer yang dapat mengelola admin',false);return page('overview',document.querySelector('[data-page="overview"]'))}
  const d=await api('/api/admin/admins');
  $('content').innerHTML=`<div class="top"><div><div class="title">Admin Accounts</div><div class="sub">Developer dapat membuat dan menghapus akun admin. Admin biasa hanya dapat mengelola user.</div></div><button class="btn" onclick="openCreateAdmin()">+ Buat Admin</button></div>
  <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Username</th><th>Role</th><th>Dibuat</th><th>Aksi</th></tr></thead><tbody>
  ${d.items.map(a=>`<tr><td><b>@${esc(a.username)}</b></td><td><span class="pill ${a.role==='developer'?'purple':'blue'}">${esc(a.role)}</span></td><td>${fmt(a.createdAt)}</td><td>${a.role==='developer'?'<span class="muted">Akun utama</span>':`<button class="btn red" onclick="deleteAdmin('${encodeURIComponent(a.username)}')">Hapus</button>`}</td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function openCreateAdmin(){
  $('modalContent').innerHTML=`<div class="modal-head"><div><h2>Buat akun admin</h2><div class="sub">Akun baru otomatis menjadi role admin, bukan developer.</div></div><button class="btn ghost" onclick="closeModal()">×</button></div>
  <div class="formgrid"><div><label class="label">Username</label><input id="newAdminUser" class="input" placeholder="admin2"></div><div><label class="label">Password</label><input id="newAdminPass" class="input" type="password" placeholder="Minimal 8 karakter"></div></div>
  <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn" onclick="createAdmin()">Buat Admin</button></div>`;
  $('modal').classList.remove('hidden');
}
async function createAdmin(){
  const username=$('newAdminUser').value.trim(),password=$('newAdminPass').value;
  try{await api('/api/admin/admins',{method:'POST',body:JSON.stringify({username,password})});toast('Admin berhasil dibuat ✓');closeModal();renderAdmins()}catch(e){toast(e.message,false)}
}
async function deleteAdmin(enc){
  if(!confirm('Hapus akun admin ini?'))return;
  try{await api('/api/admin/admins/'+enc,{method:'DELETE'});toast('Admin dihapus ✓');renderAdmins()}catch(e){toast(e.message,false)}
}
async function renderSettings(){const [s,h]=await Promise.all([api('/api/admin/settings'),api('/api/admin/health')]);$('content').innerHTML=`<div class="top"><div><div class="title">Settings</div><div class="sub">Kontrol aplikasi dan keamanan admin.</div></div><button class="btn ghost" onclick="renderSettings()">↻ Refresh</button></div><div class="card"><h3>Server controls</h3><div class="switch"><div><b>Maintenance mode</b><div class="muted">Blokir aktivitas registrasi baru.</div></div><input id="smnt" type="checkbox" ${s.maintenance?'checked':''}></div><br><div class="switch"><div><b>Registration</b><div class="muted">Izinkan user baru mendaftar.</div></div><input id="sreg" type="checkbox" ${s.registrationEnabled?'checked':''}></div><br><label class="label">Max upload MB</label><input id="smax" class="input" type="number" value="${s.maxUploadMb}"><br><br><label class="label">Announcement</label><textarea id="sann" class="textarea" rows="4">${esc(s.announcement||'')}</textarea><br><br><button class="btn" onclick="saveSettings()">Simpan Settings</button></div><br><div class="card"><h3>🔐 Admin password</h3><p class="sub">Sekarang password admin bisa diganti langsung dari website. Password disimpan sebagai hash bcrypt di database server.</p><div class="formgrid"><div class="full"><label class="label">Password saat ini</label><input id="acur" class="input" type="password" autocomplete="current-password"></div><div><label class="label">Password baru</label><input id="anew" class="input" type="password" autocomplete="new-password"></div><div><label class="label">Konfirmasi password baru</label><input id="acon" class="input" type="password" autocomplete="new-password"></div></div><div style="margin-top:14px"><button class="btn blue" onclick="changeAdminPassword()">Ubah Password Admin</button></div></div><br><div class="card"><div class="top" style="margin-bottom:10px"><div><h3 style="margin:0">Runtime health</h3><div class="sub">Informasi server saat halaman ini dibuka.</div></div><span class="pill green"><span class="health-dot"></span>OK</span></div><div class="mini-grid"><div class="mini">Node<b>${esc(h.node)}</b></div><div class="mini">Platform<b>${esc(h.platform)} / ${esc(h.arch)}</b></div><div class="mini">PID<b>${h.pid}</b></div><div class="mini">Memory<b>${Math.round(h.memory/1024/1024)} MB</b></div><div class="mini">DB<b>${Math.round(h.dbBytes/1024)} KB</b></div><div class="mini">Uploads<b>${(Number(h.uploadBytes||0)/1024/1024/1024).toFixed(2)} GB</b></div></div></div>`}
async function saveSettings(){await api('/api/admin/settings',{method:'PATCH',body:JSON.stringify({maintenance:$('smnt').checked,registrationEnabled:$('sreg').checked,maxUploadMb:Number($('smax').value),announcement:$('sann').value})});toast('Settings tersimpan ✓')}
async function changeAdminPassword(){const currentPassword=$('acur').value,newPassword=$('anew').value,confirmPassword=$('acon').value;if(newPassword.length<8)return toast('Password baru minimal 8 karakter',false);if(newPassword!==confirmPassword)return toast('Konfirmasi password tidak sama',false);await api('/api/admin/password',{method:'POST',body:JSON.stringify({currentPassword,newPassword,confirmPassword})});$('acur').value='';$('anew').value='';$('acon').value='';toast('Password admin berhasil diubah ✓')}
function closeModal(){$('modal').classList.add('hidden')}
function fmt(x){if(!x)return'—';try{return new Date(x).toLocaleString('id-ID')}catch{return x}}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b)return;const r=document.createElement('span');r.style.cssText='position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.45;transform:scale(1);pointer-events:none;left:'+(e.clientX-b.getBoundingClientRect().left-4)+'px;top:'+(e.clientY-b.getBoundingClientRect().top-4)+'px';b.style.position='relative';b.style.overflow='hidden';b.appendChild(r);r.animate([{transform:'scale(1)',opacity:.45},{transform:'scale(18)',opacity:0}],{duration:350,easing:'ease-out'}).onfinish=()=>r.remove()});boot();
</script>
</body></html>
