name: chatwithu
description: "ChatWithU - private realtime messaging client"
publish_to: "none"
version: 1.3.0+6

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.2.2
  file_picker: ^13.1.0
  image_picker: ^1.1.2
  saver_gallery: ^4.1.2
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/chat_background.jpg
