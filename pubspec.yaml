name: flutter_cloud_builder
description: Build Flutter projects into Android APKs with GitHub Actions, directly from Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  file_picker: ^8.1.7
  archive: ^3.6.1
  path_provider: ^2.1.5
  open_filex: ^4.6.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/build-flutter-apk.yml
    - assets/github_config.json
