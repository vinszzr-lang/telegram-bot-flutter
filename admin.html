<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatWithU Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#080d10;color:#eef2f4;font:14px system-ui,Segoe UI,sans-serif}button,input{font:inherit}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#11191d;border:1px solid #ffffff10;border-radius:20px;padding:18px;margin-bottom:14px}.login{max-width:420px;margin:10vh auto}.brand{font-size:26px;font-weight:900;margin-bottom:16px}.brand span{color:#20c76b}.input{width:100%;padding:13px 14px;background:#20282c;color:white;border:0;border-radius:12px;margin:6px 0}.btn{border:0;border-radius:12px;padding:11px 15px;background:#20c76b;color:#06110b;font-weight:800;cursor:pointer}.btn.red{background:#d95757;color:white}.btn.blue{background:#6c4dff;color:white}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.stat{display:flex;gap:12px}.stat .card{flex:1;min-width:150px}.num{font-size:28px;font-weight:900}.user{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#3ea6ff22;color:#5ebcff;font-size:11px;margin:2px}.ok{color:#20c76b}.muted{color:#8e9aa0}.role{font-size:11px;padding:4px 8px;border-radius:999px;background:#ffffff12;color:#cbd3d7}.section-title{font-size:18px;font-weight:900;margin-bottom:10px}@media(max-width:650px){.wrap{padding:14px}.user{align-items:flex-start;flex-direction:column}.stat{flex-direction:column}}</style></head><body><div id="app" class="wrap"><div id="login" class="card login"><div class="brand">ChatWith<span>U</span> Admin</div><input id="au" class="input" placeholder="Username admin"><input id="ap" class="input" placeholder="Password" type="password"><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Masuk</button><p id="err" class="muted"></p></div><div id="dash" class="hidden"><div class="row" style="justify-content:space-between"><div><div class="brand">ChatWith<span>U</span> Admin</div><div class="muted">Kelola user, verified, badge, ban, dan akun admin.</div><div id="who" class="role" style="display:inline-block;margin-top:6px"></div></div><button class="btn red" onclick="logout()">Keluar</button></div><div class="stat"><div class="card"><div class="muted">Users</div><div id="su" class="num">0</div></div><div class="card"><div class="muted">Messages</div><div id="sm" class="num">0</div></div><div class="card"><div class="muted">Contacts</div><div id="sc" class="num">0</div></div></div><div id="adminBox" class="card hidden"><div class="section-title">Buat akun admin</div><div class="muted">Hanya developer yang dapat membuat akun admin baru. Admin biasa tidak memiliki menu ini.</div><div class="row" style="margin-top:8px"><input id="newAdminUser" class="input" style="flex:1;min-width:180px" placeholder="Username admin baru"><input id="newAdminPass" class="input" style="flex:1;min-width:180px" placeholder="Password" type="password"><button class="btn" onclick="createAdmin()">Buat Admin</button></div><div id="adminMsg" class="muted"></div><div id="admins" style="margin-top:12px"></div></div><div class="card"><div class="row"><input id="q" class="input" style="flex:1;min-width:220px" placeholder="Cari username..." oninput="loadUsers()"><button class="btn blue" onclick="loadUsers()">Refresh</button></div></div><div id="users"></div></div></div><script>let token=localStorage.cwu_admin||'',role='';const api=p=>fetch(p,{headers:{Authorization:'Bearer '+token}});async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:au.value,password:ap.value})});const d=await r.json();if(!r.ok){err.textContent=d.message||'Login gagal';return}token=d.token;role=d.role||'';localStorage.cwu_admin=token;show()}function logout(){localStorage.removeItem('cwu_admin');location.reload()}async function show(){if(!token)return;const r=await api('/api/admin/me');if(!r.ok){logout();return}const d=await r.json();role=d.role||'';document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');document.getElementById('who').textContent='@'+d.username+' • '+(role==='developer'?'DEVELOPER':'ADMIN');if(role==='developer'){document.getElementById('adminBox').classList.remove('hidden');loadAdmins()}loadStats();loadUsers()}async function loadStats(){const r=await api('/api/admin/stats');if(!r.ok)return;const d=await r.json();su.textContent=d.users;sm.textContent=d.messages;sc.textContent=d.contacts}async function loadAdmins(){const r=await api('/api/admin/admins');if(!r.ok)return;const d=await r.json();admins.innerHTML=d.map(a=>`<div class="user" style="padding:8px 0;border-top:1px solid #ffffff0d"><div><b>@${esc(a.username)}</b> <span class="role">${esc(a.role)}</span> ${a.banned?'<span class="badge">Banned</span>':''}</div><div class="muted">${esc(a.createdAt||'')}</div></div>`).join('')}async function createAdmin(){adminMsg.textContent='';const username=newAdminUser.value.trim(),password=newAdminPass.value;if(!username||!password){adminMsg.textContent='Username dan password wajib diisi.';return}const r=await fetch('/api/admin/admins',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok){adminMsg.textContent=d.message||'Gagal membuat admin';return}adminMsg.textContent='Admin @'+d.username+' berhasil dibuat.';newAdminUser.value='';newAdminPass.value='';loadAdmins()}async function loadUsers(){const q=document.getElementById('q').value;const r=await api('/api/admin/users?q='+encodeURIComponent(q));if(!r.ok)return;const d=await r.json();users.innerHTML=d.map(u=>`<div class="card"><div class="user"><div><b>@${esc(u.username)}</b> ${u.verified?'<span class="badge">✓ Verified</span>':''} ${(u.badges||[]).map(b=>'<span class="badge">'+esc(b)+'</span>').join('')}<div class="muted">${esc(u.displayName||'')}</div></div><div class="row"><button class="btn blue" onclick='editUser(${JSON.stringify(u)})'>Edit</button><button class="btn ${u.banned?'':'red'}" onclick="toggleBan('${esc(u.username)}',${!u.banned})">${u.banned?'Unban':'Ban'}</button></div></div></div>`).join('')||'<div class="card muted">User tidak ditemukan.</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function editUser(u){const verified=confirm('OK = Verified ON\nCancel = Verified OFF');const badges=prompt('Badge, pisahkan koma',(u.badges||[]).join(', '));const body={verified,badges:badges?badges.split(',').map(x=>x.trim()).filter(Boolean):[]};const r=await fetch('/api/admin/users/'+encodeURIComponent(u.username),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});if(!r.ok){alert((await r.json()).message||'Gagal');return}loadUsers();loadStats()}async function toggleBan(u,b){const r=await fetch('/api/admin/users/'+encodeURIComponent(u),{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({banned:b})});if(!r.ok)alert((await r.json()).message||'Gagal');loadUsers()}show()</script></body></html>
